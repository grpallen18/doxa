# Admin pipeline catalog overlay — merged with manifest.yaml at npm run agents:pipeline-catalog.
# Defines story-scoped stage groupings, labels, isolation params, and invoke options for the admin UI.
#
# Claims extract/merge removed from runnable catalog (Neo4j hybrid overhaul Build 1).
# Handlers remain on disk until Build 4 deletion.

version: 1

stages:
  - id: ingestion
    label: Ingestion
    scope: story
    steps:
      - id: relevance-gate
        label: Qualify story
        isolation_params: [story_id]
      - id: review-pending-stories
        label: Resolve pending qualification
        isolation_params: [story_id]
        optional: true
      - id: scrape-story-content
        label: Scrape story content
        isolation_params: [story_id]
      - id: clean-scraped-content
        label: Clean scraped content
        isolation_params: [story_id]

  - id: graph
    label: Knowledge graph
    scope: story
    steps:
      - id: enqueue-graph-job
        label: Enqueue graph job
        isolation_params: [story_id]
        invoke_options:
          timeout_ms: 30000
      - id: trigger-graph-worker
        label: Trigger graph worker
        isolation_params: [story_id]
        optional: true
        invoke_options:
          timeout_ms: 30000

  - id: debate
    label: Debate (Neo)
    scope: global
    steps:
      - id: bind-candidates
        label: Bind candidates
        invoke_options:
          timeout_ms: 180000
      - id: detect-contrast-seeds
        label: Detect contrast seeds
        invoke_options:
          timeout_ms: 120000
      - id: enqueue-l3-reviews
        label: Enqueue L3 reviews
        invoke_options:
          timeout_ms: 120000
      - id: run-l3-curator
        label: Run L3 curator
        invoke_options:
          timeout_ms: 300000
      - id: apply-l3-proposals
        label: Apply L3 proposals
        invoke_options:
          timeout_ms: 180000
      - id: qualify-controversies
        label: Qualify controversies
        invoke_options:
          timeout_ms: 120000
      - id: run-l3-editor
        label: Run L3 editor
        invoke_options:
          timeout_ms: 300000
      - id: apply-viewpoint-proposals
        label: Apply viewpoint proposals
        invoke_options:
          timeout_ms: 120000
      - id: run-l3-auditor
        label: Run L3 auditor
        invoke_options:
          timeout_ms: 180000
      - id: sweep-counter-side
        label: Sweep counter side
        invoke_options:
          timeout_ms: 180000
      - id: detect-disputes
        label: Detect disputes
        invoke_options:
          timeout_ms: 120000
      - id: project-debate-summaries
        label: Project debate summaries
        invoke_options:
          timeout_ms: 120000
      - id: debate-pipeline
        label: Debate pipeline (orchestrator)
        invoke_options:
          timeout_ms: 600000

  - id: analysis
    label: Analysis (Neo L4)
    scope: global
    steps:
      - id: generate-evidence-check-candidates
        label: Evidence-check candidates
        invoke_options:
          timeout_ms: 120000
      - id: run-evidence-checks
        label: Run evidence checks
        invoke_options:
          timeout_ms: 300000
      - id: extract-citations
        label: Extract citations
        invoke_options:
          timeout_ms: 120000
      - id: run-controversy-assessments
        label: Controversy assessments
        invoke_options:
          timeout_ms: 300000
      - id: update-held-by-tracks
        label: Update HELD_BY tracks
        invoke_options:
          timeout_ms: 120000
      - id: link-derived-media-clips
        label: Link derived media clips
        invoke_options:
          timeout_ms: 120000
      - id: project-analysis-summaries
        label: Project analysis summaries
        invoke_options:
          timeout_ms: 120000
      - id: project-person-profiles
        label: Project person profiles
        invoke_options:
          timeout_ms: 300000
      - id: analysis-pipeline
        label: Analysis pipeline (orchestrator)
        invoke_options:
          timeout_ms: 600000

  - id: hygiene
    label: Graph hygiene
    scope: global
    steps:
      - id: graph-integrity-audit
        label: Integrity audit
        invoke_options:
          timeout_ms: 120000
      - id: prune-orphans
        label: Prune orphans
        invoke_options:
          timeout_ms: 120000
      - id: entity-alias-candidates
        label: Entity alias candidates
        invoke_options:
          timeout_ms: 120000
      - id: projection-reconcile
        label: Projection reconcile
        invoke_options:
          timeout_ms: 120000
      - id: graph-hygiene
        label: Graph hygiene (orchestrator)
        invoke_options:
          timeout_ms: 300000
