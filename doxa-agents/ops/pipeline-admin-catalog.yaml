# Admin pipeline catalog overlay — merged with manifest.yaml at npm run agents:pipeline-catalog.
# Defines story-scoped stage groupings, labels, isolation params, and invoke options for the admin UI.
#
# Claims extract/merge removed from runnable catalog (Neo4j hybrid overhaul Build 1).
# Handlers remain on disk until Build 4 deletion.

version: 1

stages:
  - id: ingestion
    label: Ingestion
    scope: story
    steps:
      - id: relevance-gate
        label: Qualify story
        isolation_params: [story_id]
      - id: review-pending-stories
        label: Resolve pending qualification
        isolation_params: [story_id]
        optional: true
      - id: scrape-story-content
        label: Scrape story content
        isolation_params: [story_id]
      - id: clean-scraped-content
        label: Clean scraped content
        isolation_params: [story_id]

  - id: graph
    label: Knowledge graph
    scope: story
    steps:
      - id: enqueue-graph-job
        label: Enqueue graph job
        isolation_params: [story_id]
        invoke_options:
          timeout_ms: 30000
      - id: trigger-graph-worker
        label: Trigger graph worker
        isolation_params: [story_id]
        optional: true
        invoke_options:
          timeout_ms: 30000

  - id: debate
    label: Debate (Neo)
    scope: global
    steps:
      - id: generate-proposition-pair-candidates
        label: Proposition pair candidates
        invoke_options:
          timeout_ms: 120000
      - id: classify-proposition-relationships
        label: Classify proposition relationships
        invoke_options:
          timeout_ms: 300000
      - id: build-viewpoints
        label: Build viewpoints
        invoke_options:
          timeout_ms: 120000
      - id: build-controversies
        label: Build controversies
        invoke_options:
          timeout_ms: 120000
      - id: detect-disputes
        label: Detect disputes
        invoke_options:
          timeout_ms: 120000
      - id: project-debate-summaries
        label: Project debate summaries
        invoke_options:
          timeout_ms: 120000
      - id: debate-pipeline
        label: Debate pipeline (orchestrator)
        invoke_options:
          timeout_ms: 600000

  - id: analysis
    label: Analysis (Neo L4)
    scope: global
    steps:
      - id: generate-evidence-check-candidates
        label: Evidence-check candidates
        invoke_options:
          timeout_ms: 120000
      - id: run-evidence-checks
        label: Run evidence checks
        invoke_options:
          timeout_ms: 300000
      - id: extract-citations
        label: Extract citations
        invoke_options:
          timeout_ms: 120000
      - id: run-controversy-assessments
        label: Controversy assessments
        invoke_options:
          timeout_ms: 300000
      - id: update-held-by-tracks
        label: Update HELD_BY tracks
        invoke_options:
          timeout_ms: 120000
      - id: link-derived-media-clips
        label: Link derived media clips
        invoke_options:
          timeout_ms: 120000
      - id: project-analysis-summaries
        label: Project analysis summaries
        invoke_options:
          timeout_ms: 120000
      - id: analysis-pipeline
        label: Analysis pipeline (orchestrator)
        invoke_options:
          timeout_ms: 600000
