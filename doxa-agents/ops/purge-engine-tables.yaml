# Tables cleared by public.purge_engine_data().
# Edit this file when engine tables are added or removed; run npm run agents:refresh.
#
# Preserved (never truncated): sources, domain_throttle, pipeline_runs, users, topics (rows).

version: 1

preserve_tables:
  - sources
  - domain_throttle
  - pipeline_runs
  - users
  - topics

# Truncate together (shared FKs); skipped if the first table is missing.
truncate_groups: []

# Truncated individually with CASCADE when the table exists.
truncate_tables:
  - story_step_runs
  - story_history
  - graph_processing_attempts
  - graph_processing_jobs
  - graph_entity_alias_candidates
  - graph_controversy_subjects
  - graph_assessments
  - graph_people
  - graph_evidence_excerpts
  - graph_topic_links
  - graph_controversy_evidence
  - graph_viewpoints
  - graph_controversies
  - stories
  - topic_relationships

# Legacy / optional schema; truncated only if present.
optional_truncate_tables: []

topics_clear_columns:
  - summary
  - topic_description
  - topic_embedding
